name: Setup Branch Protection

on:
  workflow_dispatch:

permissions:
  administration: write
  contents: read

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch protection ruleset for main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check for existing ruleset with the same name and delete it
            const { data: existing } = await github.request(
              'GET /repos/{owner}/{repo}/rulesets',
              { owner, repo }
            );
            for (const rs of existing) {
              if (rs.name === 'Protect main') {
                await github.request(
                  'DELETE /repos/{owner}/{repo}/rulesets/{ruleset_id}',
                  { owner, repo, ruleset_id: rs.id }
                );
                console.log(`Deleted existing ruleset: ${rs.name} (id=${rs.id})`);
              }
            }

            // Create the new ruleset
            await github.request('POST /repos/{owner}/{repo}/rulesets', {
              owner,
              repo,
              name: 'Protect main',
              target: 'branch',
              enforcement: 'active',
              conditions: {
                ref_name: {
                  include: ['refs/heads/main'],
                  exclude: []
                }
              },
              rules: [
                // Block direct pushes — all changes must go through a pull request
                {
                  type: 'pull_request',
                  parameters: {
                    required_approving_review_count: 1,
                    dismiss_stale_reviews_on_push: false,
                    require_code_owner_review: false,
                    require_last_push_approval: false,
                    required_review_thread_resolution: false
                  }
                },
                // Prevent force-pushes
                { type: 'non_fast_forward' },
                // Prevent branch deletion
                { type: 'deletion' }
              ]
            });

            console.log('Branch protection ruleset "Protect main" created successfully.');
            console.log('Rules applied:');
            console.log('  - Direct pushes blocked (pull request required)');
            console.log('  - 1 approving review required before merge');
            console.log('  - Force pushes blocked');
            console.log('  - Branch deletion blocked');
